    /* card — glassmorphism */
    .card {

    /* ========= Auto-sequential reveal — 원본과 동일한 규약 ========= */
    .autoshow { opacity: 0; }
    section.present .autoshow.fade-up    { animation: asFadeUp .6s ease forwards; }
    section.present .autoshow.fade-in    { animation: asFadeIn .6s ease forwards; }
    section.present .autoshow.fade-left  { animation: asFadeLeft .6s ease forwards; }
    section.present .autoshow.fade-right { animation: asFadeRight .6s ease forwards; }
    section.present .autoshow.zoom-in    { animation: asZoomIn .6s ease forwards; }
    @keyframes asFadeUp    { from { opacity:0; transform: translateY(18px); } to { opacity:1; transform:none; } }
    @keyframes asFadeIn    { from { opacity:0; } to { opacity:1; } }
    @keyframes asFadeLeft  { from { opacity:0; transform: translateX(-26px); } to { opacity:1; transform:none; } }
    @keyframes asFadeRight { from { opacity:0; transform: translateX(26px); } to { opacity:1; transform:none; } }
    @keyframes asZoomIn    { from { opacity:0; transform: scale(.85); } to { opacity:1; transform:scale(1); } }
    .autoshow:nth-child(1) { animation-delay: .05s; }
    .autoshow:nth-child(2) { animation-delay: .2s; }
    .autoshow:nth-child(3) { animation-delay: .35s; }
    .autoshow:nth-child(4) { animation-delay: .5s; }
    .autoshow:nth-child(5) { animation-delay: .65s; }
    .autoshow:nth-child(6) { animation-delay: .8s; }
    .autoshow:nth-child(7) { animation-delay: .95s; }
    .autoshow:nth-child(8) { animation-delay: 1.1s; }

    /* ========= 시뮬레이션 타임라인 ========= */

    }
    .fx-box .fx-name { font-size: 1.22rem; font-weight: 800; }
    .fx-box .fx-val { font-family: 'JetBrains Mono', monospace; font-size: 1.4rem; font-weight: 800; color: #fff; }
    .fx-box.dim .fx-val { color: #FF8A96; }
    .fx-box.hero { border-color: rgba(43,234,208,.7); box-shadow: 0 0 30px rgba(43,234,208,.2); }
    .fx-op { font-size: 2.2rem; font-weight: 800; color: var(--fg-soft) !important; }

    /* ========= 단계 루프 (TDD) ========= */
    .loop-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: .7rem; }
    .loop-step {
      display: flex; flex-direction: column; gap: .25rem; align-items: flex-start;
      padding: .7rem .9rem; border-radius: 12px;
      border: 1px solid rgba(190,200,224,0.4);
      background: rgba(230,236,249,0.06);
    }
    .loop-step .no { font-family: 'JetBrains Mono', monospace; font-size: .8rem; font-weight: 800; color: #B5A1FF !important; }
    .loop-step .nm2 { font-size: 1.12rem; font-weight: 800; }
    .loop-step .ds { font-size: .95rem; color: #C9D2E4 !important; }
    .loop-step.hot { border-color: rgba(43,234,208,.65); background: rgba(43,234,208,.08); }
    .loop-step.hot .no { color: #5BFFE0 !important; }

    /* ========= 경고 배너 (knowledge 덱과 동일) ========= */
    .warn-banner {
      display: flex; gap: .9rem; align-items: center;
      background: linear-gradient(90deg, rgba(120,20,35,0.5), rgba(70,18,40,0.35));
      border: 1.5px solid rgba(255,77,94,0.7);
      border-radius: 14px;
      padding: .7rem 1.1rem;
      font-size: 1.22rem; font-weight: 700;
    }
    .warn-banner .wb-icon { font-size: 1.8rem; flex: 0 0 auto; }

    /* ========= 비교 테이블 (knowledge 덱과 동일) ========= */
    .gh-table { width: 100%; border-collapse: collapse; }
    .gh-table th, .gh-table td {
      padding: .5rem .9rem; text-align: left;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      font-size: 1.08rem; line-height: 1.45;
    }
    .gh-table th { font-family: 'JetBrains Mono', monospace; font-size: .9rem; letter-spacing: .05em; color: #B5A1FF !important; }

    /* ========= 치트시트 (knowledge 덱과 동일 + 체크 변형) ========= */
    .cheat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem 1rem; }
    .cheat {
      display: flex; align-items: baseline; gap: .7rem;
      font-size: .98rem; line-height: 1.4;
      padding: .42rem .8rem; border-radius: 10px;
      background: rgba(20,22,44,0.5);
      border: 1px solid rgba(155,130,255,0.28);
    }
    .cheat .ct { flex: 0 0 6em; font-weight: 800; color: #CBBDFF !important; font-size: .9rem; }
    .cheat .cp { color: #E8ECF5 !important; }
    .cheat .cp::before { content: "💬 "; }
    .cheat.chk .cp::before { content: "☑ "; color: #5BFFE0; }

    /* ========= 곡선 SVG 공통 ========= */
    .reveal section svg text {
      paint-order: stroke fill;
      stroke: #06080F;
      stroke-width: 1.2px;
      stroke-linejoin: round;
    }
    .curve-draw { stroke-dasharray: 620; stroke-dashoffset: 620; }
    section.present .curve-draw { animation: curveDraw 1.8s ease-out .4s forwards; }
    @keyframes curveDraw { to { stroke-dashoffset: 0; } }

    /* ========= 슬라이드 하단 레퍼런스 링크 ========= */
    .slide-refs {
      position: absolute; left: 56px; bottom: 12px; z-index: 3;
      display: flex; gap: 1.1rem; align-items: center; flex-wrap: wrap;
      max-width: 66%;
      font-family: 'JetBrains Mono', monospace; font-size: .78rem;
      opacity: .8;
    }
    .slide-refs .rl { color: #9BA6C0 !important; font-weight: 800; letter-spacing: .12em; }
    .slide-refs a {
      color: #8FF5E2 !important; text-decoration: none !important;
      border-bottom: 1px dotted rgba(91,255,224,.45); white-space: nowrap;
    }
    .slide-refs a:hover { color: #5BFFE0 !important; border-bottom-color: #5BFFE0; }

    /* ========= 참고자료 슬라이드 ========= */
    .ref-col h3 { font-size: 1.3rem; }
    .ref-col ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .6rem; }
    .ref-col li { font-size: 1.02rem !important; line-height: 1.45; }
    .ref-col li a { font-weight: 700; }
    .ref-col li .rd { display: block; font-size: .88rem; color: #9BA6C0 !important; }

    /* ==================================================================
       ▼▼ verification 덱 전용 시그니처 컴포넌트 4종 ▼▼
       ================================================================== */

    /* ========= ① 판결 씬 (S2) — 그럴듯함의 함정 =========
       초록 체크가 쌓인 뒤, 스캔 라인이 지나가며 미묘한 버그 한 줄이
       분홍으로 드러난다. */
    .verdict-card { position: relative; }
    .verdict-card pre.code { font-size: 1.08rem; }
    .verdict-card::after {
      content: ""; position: absolute; left: 6px; right: 6px; top: 0; height: 3px;
      border-radius: 3px; opacity: 0; pointer-events: none;
      background: linear-gradient(90deg, transparent, rgba(255,122,149,0.95), transparent);
      box-shadow: 0 0 18px rgba(255,122,149,0.8);
    }
    section:has(.vd-reveal.visible) .verdict-card::after { animation: vdScan 1.1s ease forwards; }
    @keyframes vdScan { 0% { opacity: 1; top: 4%; } 100% { opacity: 0; top: 94%; } }
    .bugline {
      border-radius: 6px; padding: 0 .15em;
      transition: background .6s ease .55s, box-shadow .6s ease .55s;
    }
    section:has(.vd-reveal.visible) .bugline {
      background: rgba(255,122,149,0.22);
      box-shadow: 0 0 0 1.5px rgba(255,122,149,0.85);
    }
    .vd-badges { display: flex; gap: .6rem; flex-wrap: wrap; }
    .vd-badge {
      display: inline-flex; align-items: center; gap: .4em;
      padding: .34em .9em; border-radius: 999px; white-space: nowrap;
      font-family: 'JetBrains Mono', monospace; font-size: 1rem; font-weight: 800;
      background: rgba(13,61,56,0.92); border: 1px solid rgba(43,234,208,0.8);
      color: #C5FFF5 !important; text-shadow: none !important;
    }
    .vd-tag {
      display: inline-flex; align-items: center; gap: .5em;
      padding: .45em 1em; border-radius: 12px;
      background: rgba(74,26,38,0.92); border: 1.5px solid rgba(255,122,149,0.85);
      color: #FFD0DA !important; font-size: 1.12rem; font-weight: 800;
      box-shadow: 0 0 26px rgba(255,122,149,0.25);
    }

    /* ========= ② 검증의 사다리 (S8) =========
       아래→위로 쌓이는 계단. 단마다 '사람 노력'(분홍)과 '신뢰'(청록)
       미니 게이지가 반대로 움직인다. */
    .vlad-wrap { display: flex; gap: 1.6rem; align-items: stretch; justify-content: center; }
    .vladder { display: flex; flex-direction: column-reverse; gap: .5rem; }
    .vrung {
      display: flex; align-items: center; gap: .9rem;
      width: 660px; padding: .55rem 1.1rem; border-radius: 12px;
      border: 1px solid rgba(155,130,255,0.4);
      background: rgba(40,30,80,0.25);
      margin-left: calc((var(--i, 1) - 1) * 46px);
    }
    .vrung .vno {
      font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: .95rem;
      color: #B5A1FF !important; width: 1.3em; flex: 0 0 auto;
    }
    .vrung .vname { font-size: 1.22rem; font-weight: 800; white-space: nowrap; }
    .vrung .vdesc { font-size: .92rem; color: #C9D2E4 !important; }
    .vrung.top { border-color: rgba(43,234,208,0.7); background: rgba(15,60,55,0.35); }
    .vrung.top .vno { color: #5BFFE0 !important; }
    .vmeter { margin-left: auto; display: flex; flex-direction: column; gap: .28rem; width: 168px; flex: 0 0 auto; }
    .vm-row { display: flex; align-items: center; gap: .45rem; }
    .vm-lab {
      font-family: 'JetBrains Mono', monospace; font-size: .68rem; font-weight: 800;
      width: 3.2em; flex: 0 0 auto; color: #9BA6C0 !important; text-shadow: none !important;
    }
    .vm-bar {
      flex: 1; height: 9px; border-radius: 5px; overflow: hidden;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.10);
    }
    .vm-bar i { display: block; height: 100%; width: var(--w, 0%); border-radius: 5px; }
    .vm-effort i { background: linear-gradient(90deg, rgba(255,122,149,.9), rgba(255,122,149,.55)); }
    .vm-trust  i { background: linear-gradient(90deg, rgba(43,234,208,.9), rgba(43,234,208,.55)); }
    .vlad-axis {
      display: flex; flex-direction: column; justify-content: space-between;
      padding: .4rem 0; font-family: 'JetBrains Mono', monospace;
      font-size: .95rem; font-weight: 800; text-align: center; white-space: nowrap;
    }

    /* ========= ③ 답안지 조작 씬 (S13) — 보상 해킹 =========
       원래 테스트의 assert가 취소선으로 죽고, 약화된 테스트와
       '가짜 초록불' 배지가 나타난다. */
    .assert-line { transition: opacity .5s ease, filter .5s ease; }
    section:has(.tp1.visible) .assert-line {
      text-decoration: line-through; text-decoration-color: rgba(255,122,149,.95);
      text-decoration-thickness: 2.5px; opacity: .55; filter: grayscale(.4);
    }
    .tamper-pass {
      display: inline-flex; align-items: center; gap: .55em;
      padding: .4em 1.1em; border-radius: 999px;
      font-family: 'JetBrains Mono', monospace; font-size: 1.08rem; font-weight: 800;
      background: rgba(13,61,56,0.92); border: 1.5px solid rgba(43,234,208,0.85);
      color: #C5FFF5 !important; text-shadow: none !important;
      box-shadow: 0 0 26px rgba(43,234,208,0.3);
      animation: fakePulse 1.6s ease-in-out infinite;
    }
    @keyframes fakePulse {
      0%, 100% { box-shadow: 0 0 18px rgba(43,234,208,0.25); }
      50%      { box-shadow: 0 0 40px rgba(43,234,208,0.55); }
    }
    .tamper-arrow {
      display: flex; flex-direction: column; align-items: center; gap: .15rem;
      font-size: 1.9rem; font-weight: 800; color: #FF94AC !important; flex: 0 0 auto;
    }
    .tamper-arrow .t {
      font-size: .82rem; font-family: 'JetBrains Mono', monospace;
      color: #FFB9C7 !important; white-space: nowrap;
    }
    .trick-chip {
      display: inline-flex; align-items: center; gap: .4em;
      padding: .32em .85em; border-radius: 9px; white-space: nowrap;
      font-size: 1.02rem; font-weight: 800;
      background: rgba(74,26,38,0.85); border: 1px solid rgba(255,122,149,0.6);
      color: #FFD0DA !important; text-shadow: none !important;
    }

    /* ========= ④ 신뢰 다이얼 (S21) =========
       반원 게이지 위 바늘이 fragment에 따라 회전 — 작업의 무게에 맞는
       검증 강도. 청록(가볍게)→노랑(기본)→분홍(풀세트). */
    .dial-wrap { display: flex; flex-direction: column; align-items: center; gap: .3rem; flex: 0 0 auto; }
    .dial-svg { width: 460px; max-width: 100%; }
    .dial-needle {
      transform-origin: 230px 230px;
      transform: rotate(-78deg);
      transition: transform .9s cubic-bezier(.3,.7,.3,1.05);
    }
    section:has(.td1.visible) .dial-needle { transform: rotate(-58deg); }
    section:has(.td2.visible) .dial-needle { transform: rotate(0deg); }
    section:has(.td3.visible) .dial-needle { transform: rotate(58deg); }
    .dial-caption {
      font-family: 'JetBrains Mono', monospace; font-size: 1rem; font-weight: 800;
      color: #E6D9FF !important; text-align: center; margin: 0;
    }
    .dial-card {
      display: flex; gap: .9rem; align-items: baseline;
      padding: .7rem 1.1rem; border-radius: 12px;
      border: 1px solid rgba(190,200,224,0.35);
      background: rgba(230,236,249,0.05);
    }
    .dial-card .dc-name { font-weight: 800; font-size: 1.18rem; white-space: nowrap; min-width: 8.6em; }
    .dial-card .dc-desc { font-size: 1.04rem; color: #E8ECF5 !important; }
    .dial-card.lv1 { border-color: rgba(43,234,208,0.55); }
    .dial-card.lv2 { border-color: rgba(255,212,107,0.55); }
    .dial-card.lv3 { border-color: rgba(255,122,149,0.6); }

    /* ========= fallbacks: overview / print / reduced-motion =========
       .autoshow·곡선·다이얼 — 가시성이 애니메이션에 묶여 있으므로
       세 모드 전부에서 강제로 완성 상태를 보여준다. */
    .reveal.overview .autoshow {
      opacity: 1 !important;
      animation: none !important;
      transform: none !important;
    }
    .reveal.overview .slides section {
      display: block !important;
      cursor: pointer;
      outline: 1px solid rgba(181, 161, 255, 0.28);
      outline-offset: -1px;
      border-radius: 6px;
    }
    .reveal.overview .slides section:hover { outline: 2px solid #B5A1FF; }
    .reveal.overview .slides section.present { outline: 3px solid #5BFFE0; }
    @media print {
      .reveal .autoshow {
        opacity: 1 !important;
        animation: none !important;
        transform: none !important;
      }
      .reveal .fragment.custom {
        opacity: 1 !important;
        visibility: visible !important;
        transform: none !important;
      }
      .curve-draw { stroke-dashoffset: 0 !important; animation: none !important; }
      .dl-toolbar { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .reveal .autoshow {
        opacity: 1 !important;
        animation: none !important;
        transform: none !important;
      }
      .grad, .tamper-pass { animation: none !important; }
      body::before { animation: none !important; }
      .verdict-card::after { animation: none !important; opacity: 0 !important; }
      .bugline, .assert-line, .dial-needle { transition: none !important; }
      .curve-draw { stroke-dashoffset: 0; animation: none !important; }
    }
  </style>
</head>
<body>

<div class="dl-toolbar">
  <select id="tocSelect" class="transition-select" aria-label="목차 — 슬라이드로 바로 이동" title="목차 — 슬라이드로 바로 이동"></select>
  <a class="dl-btn" href="../intro/index.html" title="원본 세미나: 바이브 코딩이란 무엇인가?">
    <span aria-hidden="true">↗</span><span>원본 세미나</span>
  </a>
  <button id="fullscreenBtn" class="dl-btn" title="전체화면 전환 (F)">
    <span aria-hidden="true">⛶</span><span>FULL</span>
  </button>
</div>

<div class="reveal">
  <div class="slides">

  </div>
</div>

</body>
